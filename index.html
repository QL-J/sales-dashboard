<script>
"use strict";
var DATA = JSON.parse(document.getElementById("payload").textContent);
var ML = { qty: "出库数量", amount: "货值(¥)" };
var state = { mode: "channel", metric: "qty", channel: null, product: null, chSearchName: "", chSearchUpc: "", chMonths: [], mdropOpen: false, prodName: "", prodUpc: "", prodChannels: [], chdropOpen: false, onlyNew: false, anomaly: false, anomalyChannel: null, anomalyFilter: "all" };
var PMAP = {};
DATA.products.forEach(function (p) { PMAP[p.code] = p; });

function $(id) { return document.getElementById(id); }
function fmt(n) {
  n = Math.round((n || 0) * 100) / 100;
  return n.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
}
function fmtAmt(n) { return "¥" + fmt(n); }
function mv(cell) { return state.metric === "qty" ? cell.qty : cell.amount; }
function mLabel(m) { return m.slice(5) + "月"; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m];
  });
}

// ---------- 库存匹配 + 周转天数 ----------
function invOf(channel, upc) {
  return DATA.inventory[channel + "|" + upc] || null;
}
function invQtyHtml(channel, upc) {
  var inv = invOf(channel, upc);
  if (!inv || !inv.qty) return "<td class='cell num0 col-inv'>—</td>";
  return "<td class='cell inv-cell col-inv' style='color:#0f172a;font-weight:600' data-act='inv' data-ch='" + esc(channel) + "' data-upc='" + esc(upc) + "'>" +
    fmt(inv.qty) + "</td>";
}
function turnoverHtml(channel, upc, last21qty) {
  var inv = invOf(channel, upc);
  if (!inv || !inv.qty) return "<td class='cell num0 col-turn'>无库存</td>";
  if (!(last21qty > 0)) return "<td class='cell col-turn' title='近3周无销量' style='color:#dc2626;font-weight:600'>∞</td>";
  var t = inv.qty / (last21qty / 21);   // 近3周(21天)合计销量 ÷ 21 = 日均销量；库存 ÷ 日均 = 周转天数
  var cls = t <= 7 ? "tension" : (t > 60 ? "overstock" : "");
  var d = Math.round(t);
  if (d < 1 && t > 0) d = 1;   // 不足1天按1天显示，避免误显示为0天
  return "<td class='cell " + cls + " col-turn'>" + d + "</td>";
}
function pctLabel(bucket) {
  if (bucket == null || bucket === "") return "—";
  var s = String(bucket).trim();
  var num = parseFloat(s);
  if (!isNaN(num) && /^-?\d+(\.\d+)?$/.test(s)) {
    return Math.floor(num * 100) + "%";
  }
  // 兜底：源数据若仍为分桶文本
  s = s.replace(/0<X<=(\d+)%/, "≤$1%").replace(/(\d+)%<X<=(\d+)%/, "$1–$2%").replace(/>100%/, ">100%");
  return s;
}
function pctValue(bucket) {
  if (bucket == null || bucket === "") return 9999;
  var s = String(bucket).trim();
  var num = parseFloat(s);
  if (!isNaN(num) && /^-?\d+(\.\d+)?$/.test(s)) {
    return Math.floor(num * 100);
  }
  var m = s.match(/<=(\d+)%/);
  if (m) return parseInt(m[1], 10);
  if (s.indexOf(">100%") >= 0) return 200;
  return 9999;
}
function showInvModal(channel, upc) {
  var inv = invOf(channel, upc);
  if (!inv) return;
  $("invTitle").textContent = channel + " · " + upc;
  var batches = inv.batches || [];
  // 按（剩余效期百分比，库存等级）分组：良品/残品分开显示各自数量
  var groups = {};
  batches.forEach(function (b) {
    var pv = pctValue(b.shelf_pct);
    var gk = pv + "|" + (b.grade || "—");
    if (!groups[gk]) groups[gk] = { qty: 0, dates: [], whs: {}, pct: pv, grade: b.grade || "—", raw: b.shelf_pct };
    groups[gk].qty += (b.qty || 0);
    if (b.expiry) groups[gk].dates.push(b.expiry);
    if (b.warehouse) groups[gk].whs[b.warehouse] = 1;
  });
  var gkeys = Object.keys(groups).sort(function (a, b) {
    var ga = groups[a], gb = groups[b];
    if (ga.pct !== gb.pct) return ga.pct - gb.pct;
    return String(ga.grade).localeCompare(String(gb.grade));
  });
  var tot = 0; gkeys.forEach(function (k) { tot += groups[k].qty; });
  $("invSub").textContent = "可用库存合计 " + fmt(inv.qty) + " 件 ｜ 共 " + gkeys.length + " 个效期/等级组合（" + batches.length + " 条批次）";
  var tbl = "<table><thead><tr><th>数量</th><th class='lft'>到期日</th><th>剩余效期</th><th class='lft'>库存等级</th><th class='lft'>仓库</th></tr></thead><tbody>";
  gkeys.forEach(function (gk) {
    var g = groups[gk];
    var pv = g.pct;
    var pcls = pv <= 20 ? " style='color:#dc2626;font-weight:700'" : (pv <= 40 ? " style='color:#ea580c;font-weight:600'" : "");
    var dates = g.dates.slice().sort();
    var allSame = dates.length && dates[0] === dates[dates.length - 1];
    var dateTxt = dates.length ? (allSame ? dates[0] : dates[0] + " 等") : "—";
    var title = dates.length && !allSame ? " title='到期日：" + esc(dates.join("、")) + "'" : "";
    var whTxt = Object.keys(g.whs).join("、") || "—";
    tbl += "<tr><td class='cell'>" + fmt(g.qty) + "</td><td class='lft'" + title + ">" + esc(dateTxt) + "</td>" +
      "<td class='cell'" + pcls + ">" + esc(pctLabel(g.raw)) + "</td><td class='lft'>" + esc(g.grade || "—") + "</td><td class='lft'>" + esc(whTxt) + "</td></tr>";
  });
  tbl += "</tbody></table>";
  $("invBody").innerHTML = tbl;
  $("invModal").classList.add("open");
}
function metaStr() {
  // 统一周口径：顶部说明展示最近连续三周窗口（第1周=昨天往前7天）
  return "数据源: " + DATA.source + " ｜ 工作页: " + DATA.sheet + " ｜ 生成: " + DATA.generated_at +
    " ｜ 月份: " + (DATA.months[0] || "-") + " ~ " + (DATA.months[DATA.months.length - 1] || "-") +
    " ｜ 第1周: " + (DATA.week1_window ? DATA.week1_window[0] + " ~ " + DATA.week1_window[1] : "-") +

// ---------- 通用柱状图 ----------
function barChart(labels, vals) {
  var W = 900, H = 200, padL = 66, padB = 36, padT = 14, padR = 14;
  var max = Math.max(1, Math.max.apply(null, vals));
  var bw = (W - padL - padR) / labels.length;
  var s = "<svg viewBox='0 0 " + W + " " + H + "'>";
  for (var i = 0; i <= 4; i++) {
    var y = padT + (H - padT - padB) * (i / 4);
    var v = max * (1 - i / 4);
    s += "<line x1='" + padL + "' y1='" + y + "' x2='" + (W - padR) + "' y2='" + y + "' stroke='#eef2f7'/>";
    s += "<text x='" + (padL - 8) + "' y='" + (y + 4) + "' text-anchor='end' font-size='10' fill='#94a3b8'>" + fmt(v) + "</text>";
  }
  for (var j = 0; j < vals.length; j++) {
    var vv = vals[j];
    var h = (H - padT - padB) * (vv / max);
    var x = padL + j * bw + bw * 0.2;
    var y2 = H - padB - h;
    var w = bw * 0.6;
    s += "<rect x='" + x + "' y='" + y2 + "' width='" + w + "' height='" + h + "' rx='3' fill='#2563eb'/>";
    if (h > 16) s += "<text x='" + (x + w / 2) + "' y='" + (y2 - 4) + "' text-anchor='middle' font-size='9' fill='#475569'>" + fmt(vv) + "</text>";
    s += "<text x='" + (x + w / 2) + "' y='" + (H - padB + 14) + "' text-anchor='middle' font-size='10' fill='#64748b'>" + labels[j] + "</text>";
  }
  s += "</svg>";
  return s;
}

// ---------- 紧凑曲线图（渠道明细底部用） ----------
function lineChart(labels, vals) {
  var W = 900, H = 90, padL = 56, padB = 26, padT = 10, padR = 14;
  var max = Math.max(1, Math.max.apply(null, vals));
  var dx = (W - padL - padR) / (labels.length - 1 || 1);
  var yOf = function (v) { return padT + (H - padT - padB) * (1 - v / max); };
  var pts = vals.map(function (v, i) { return (padL + i * dx) + "," + yOf(v); }).join(" ");
  var s = "<svg viewBox='0 0 " + W + " " + H + "'>";
  // 横向淡网格
  for (var i = 0; i <= 2; i++) {
    var y = padT + (H - padT - padB) * (i / 2);
    var v = max * (1 - i / 2);
    s += "<line x1='" + padL + "' y1='" + y + "' x2='" + (W - padR) + "' y2='" + y + "' stroke='#eef2f7'/>";
    s += "<text x='" + (padL - 6) + "' y='" + (y + 3) + "' text-anchor='end' font-size='9' fill='#94a3b8'>" + fmt(v) + "</text>";
  }
  // 折线
  s += "<polyline points='" + pts + "' fill='none' stroke='#2563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>";
  // 点 + 数值 + 标签
  vals.forEach(function (vv, j) {
    var x = padL + j * dx;
    var y = yOf(vv);
    s += "<circle cx='" + x + "' cy='" + y + "' r='2.5' fill='#2563eb'/>";
    s += "<text x='" + x + "' y='" + (y - 5) + "' text-anchor='middle' font-size='8' fill='#475569'>" + fmt(vv) + "</text>";
    s += "<text x='" + x + "' y='" + (H - padB + 11) + "' text-anchor='middle' font-size='9' fill='#64748b'>" + labels[j] + "</text>";
  });
  s += "</svg>";
  return s;
}

function tokenize(s) {
  if (!s) return [];
  return s.split(/[\s,，;；、]+/).filter(function (t) { return t.length > 0; });
}
function anyMatch(tokens, text) {
  if (!tokens.length) return true;
  var t = (text || "").toLowerCase();
  for (var i = 0; i < tokens.length; i++) {
    if (t.indexOf(tokens[i].toLowerCase()) >= 0) return true;
  }
  return false;
}

// 两级降序排序：第一级按 UPC 汇总销量（该 UPC 下所有渠道之和）从高到低；
// 第二级在同一 UPC 分组内按各渠道销量从高到低。
function sortProductRows(rows) {
  var upcTotals = {};
  rows.forEach(function (r) {
    var v = state.metric === "qty" ? r.bc.total_qty : r.bc.total_amount;
    upcTotals[r.code] = (upcTotals[r.code] || 0) + v;
  });
  rows.sort(function (a, b) {
    var ga = upcTotals[a.code], gb = upcTotals[b.code];
    if (gb !== ga) return gb - ga;                    // UPC 汇总销量降序
    var ta = state.metric === "qty" ? a.bc.total_qty : a.bc.total_amount;
    var tb = state.metric === "qty" ? b.bc.total_qty : b.bc.total_amount;
    if (tb !== ta) return tb - ta;                    // 组内渠道销量降序
    if (a.name !== b.name) return a.name.localeCompare(b.name);
    return a.channel.localeCompare(b.channel);
  });
  return rows;
}

  $("crumb").style.display = "none";

// ---------- 销量异动分析（近7天日均 vs 近14天日均，按渠道） ----------
var SURGE_TH = 0.5;   // 近7天日均 较 近14天日均 增幅 >= +50% 视为「激增」
var DROP_TH = -0.5;   // 降幅 <= -50% 视为「锐减」

function anomalyCompute(channel) {
  var rows = [];
  DATA.products.forEach(function (p) {
    var q7 = 0, q14 = 0;
    if (channel) {
      var bc = p.by_channel[channel];
      if (!bc) return;
      q7 += bc.last7_qty; q14 += bc.last14_qty;
    } else {
      Object.keys(p.by_channel).forEach(function (c) {
        var bc = p.by_channel[c];
        q7 += bc.last7_qty; q14 += bc.last14_qty;
      });
    }
    if (q7 === 0 && q14 === 0) return;
    var avg7 = q7 / 7, avg14 = q14 / 14;
    var ratio, status;
    if (avg14 === 0) {
      if (avg7 > 0) { status = "surge"; ratio = null; }   // 新近起量，14天前为0
      else { status = "flat"; ratio = 0; }
    } else {
      ratio = (avg7 - avg14) / avg14;
      if (ratio >= SURGE_TH) status = "surge";
      else if (ratio <= DROP_TH) status = "drop";
      else status = "flat";
    }
    rows.push({ code: p.code, name: p.name, channel: channel || "全部渠道", q7: q7, q14: q14, avg7: avg7, avg14: avg14, ratio: ratio, status: status });
  });
  return rows;
}

function renderAnomaly() {
  var channel = state.anomalyChannel;
  $("crumb").style.display = "flex";
  $("crumbBack").style.display = "none";
  $("crumb").innerHTML = "<span class='cLink' data-act='anomalyBack'>渠道销量查询</span> <span>›</span> <b>销量异动分析</b>";
  setKpis([
    { l: "分析维度", v: channel || "全部渠道", s: "" },
    { l: "近7天窗口", v: (DATA.last7_window ? DATA.last7_window[0] + "~" + DATA.last7_window[1] : "-"), s: "" },
    { l: "近14天窗口", v: (DATA.last14_window ? DATA.last14_window[0] + "~" + DATA.last14_window[1] : "-"), s: "" },
    { l: "激增阈值", v: "+50%", s: "" }
  ]);
  $("title").textContent = "销量异动分析 · " + (channel || "全部渠道");
  $("meta").textContent = "对比每个货品「近7天日均」与「近14天日均」：增幅≥+50%为激增，降幅≤−50%为锐减，其余为平稳。";

  var rows = anomalyCompute(channel);
  var surge = rows.filter(function (r) { return r.status === "surge"; }).length;
  var drop = rows.filter(function (r) { return r.status === "drop"; }).length;
  var flat = rows.filter(function (r) { return r.status === "flat"; }).length;

  var filter = state.anomalyFilter;
  var shown = rows.filter(function (r) {
    return filter === "all" || r.status === filter;
  });
  // 排序：激增(ratio 最大)在最前；ratio 为 null 的新起量排最前；锐减(负)在后
  shown.sort(function (a, b) {
    var ra = a.ratio == null ? Infinity : a.ratio;
    var rb = b.ratio == null ? Infinity : b.ratio;
    return rb - ra;
  });

  var chOpts = "<option value='' " + (channel ? "" : "selected") + ">全部渠道</option>" +
    DATA.channels.map(function (c) {
      return "<option value='" + esc(c) + "' " + (channel === c ? "selected" : "") + ">" + esc(c) + "</option>";
    }).join("");

  var html = "<div class='anomaly-wrap'>";
  html += "<div class='anomaly-bar'>";
  html += "<label style='font-size:12px;color:#475569'>渠道：</label><select class='an-sel' id='anChannel'>" + chOpts + "</select>";
  html += "<span class='achip " + (filter === "all" ? "active" : "") + "' data-f='all'>全部 (" + rows.length + ")</span>";
  html += "<span class='achip " + (filter === "surge" ? "active" : "") + "' data-f='surge'>激增 (" + surge + ")</span>";
  html += "<span class='achip " + (filter === "drop" ? "active" : "") + "' data-f='drop'>锐减 (" + drop + ")</span>";
  html += "<span class='achip " + (filter === "flat" ? "active" : "") + "' data-f='flat'>平稳 (" + flat + ")</span>";
  html += "<div class='astat-box'><span class='astat-surge'>激增 " + surge + "</span><span class='astat-drop'>锐减 " + drop + "</span><span class='astat-flat'>平稳 " + flat + "</span></div>";
  html += "</div>";

  html += "<div class='card'><div class='table-wrap'><table><thead><tr>";
  html += "<th class='lft'>货品名称</th><th class='lft'>UPC条码</th>";
  if (!channel) html += "<th class='lft'>渠道</th>";
  html += "<th>近7天销量</th><th>近7天日均</th><th>近14天销量</th><th>近14天日均</th><th>变化率</th><th>状态</th></tr></thead><tbody>";
  if (shown.length === 0) {
    html += "<tr><td colspan='" + (channel ? 7 : 8) + "' class='empty'>无匹配货品</td></tr>";
  } else {
    shown.forEach(function (r) {
      html += "<tr>";
      html += "<td class='lft'><span class='prod' title='" + esc(r.name) + "'>" + esc(r.name) + "</span></td>";
      html += "<td class='lft'><span class='code'>" + esc(r.code) + "</span></td>";
      if (!channel) html += "<td class='lft'>" + esc(r.channel) + "</td>";
      html += "<td class='cell'>" + fmt(r.q7) + "</td>";
      html += "<td class='cell' style='color:#2563eb;font-weight:600'>" + fmt(r.avg7) + "</td>";
      html += "<td class='cell'>" + fmt(r.q14) + "</td>";
      html += "<td class='cell' style='color:#16a34a;font-weight:600'>" + fmt(r.avg14) + "</td>";
      if (r.ratio == null) {
        html += "<td class='cell pct-up'>新起量</td>";
      } else {
        var cls = r.ratio >= 0 ? "pct-up" : "pct-down";
        html += "<td class='cell " + cls + "'>" + (r.ratio >= 0 ? "+" : "") + (r.ratio * 100).toFixed(0) + "%</td>";
      }
      var stTxt = r.status === "surge" ? "激增" : (r.status === "drop" ? "锐减" : "平稳");
      var stCls = r.status === "surge" ? "st-surge" : (r.status === "drop" ? "st-drop" : "st-flat");
      html += "<td class='cell'><span class='astatus " + stCls + "'>" + stTxt + "</span></td>";
      html += "</tr>";
    });
  }
  html += "</tbody></table></div></div></div>";
  $("content").innerHTML = html;

  $("anChannel").onchange = function () {
    state.anomalyChannel = this.value || null;
    render();
  };
  Array.prototype.forEach.call(document.querySelectorAll(".achip"), function (chip) {
    chip.onclick = function () { state.anomalyFilter = chip.dataset.f; render(); };
  });
}
function render() {

  else if (state.mode === "channel") {
    if (state.channel) renderChannelDetail(state.channel);

// 筛选条是吸顶的，表格表头必须紧贴其下沿：动态量取筛选条真实高度写入 --sr-h，
// 避免写死像素（型号不同/文字换行/缩放时）导致表头错位或与筛选条重叠。
function syncStickyOffset() {
  var rows = document.querySelectorAll(".searchrow");
  var h = 0;
  for (var i = 0; i < rows.length; i++) {
    var b = rows[i].getBoundingClientRect();
    if (b.height > 0) { h = Math.round(b.height); break; }
  }
  if (!h) h = 66;
  document.documentElement.style.setProperty("--sr-h", h + "px");
}
window.addEventListener("resize", function () { syncStickyOffset(); });

  $("btnChannel").classList.toggle("active", state.mode === "channel" && !state.anomaly);
  $("btnProduct").classList.toggle("active", state.mode === "product" && !state.anomaly);

function csvEsc(v) {
  var s = String(v == null ? "" : v).replace(/"/g, '""');
  if (/[",\n\r]/.test(s)) s = '"' + s + '"';
  return s;
}
function exportCurrentTable() {
  var table = $("content").querySelector("table");
  if (!table) { alert("当前视图没有可导出的表格"); return; }
  var headerRow = table.querySelector("thead tr");
  var upcIdx = [];
  if (headerRow) {
    Array.from(headerRow.querySelectorAll("th")).forEach(function (th, i) {
      if (th.textContent.indexOf("UPC") >= 0) upcIdx.push(i);
    });
  }
  var rows = [];
  table.querySelectorAll("tr").forEach(function (tr) {
    var cells = Array.from(tr.querySelectorAll("th,td")).map(function (cell, i) {
      var v = cell.textContent.trim();
      // UPC 列按文本格式导出（="048107234805"），保留前导 0，避免 Excel 转数字/科学计数法
      if (upcIdx.indexOf(i) >= 0 && /^[0-9]+$/.test(v)) return '="' + v + '"';
      return csvEsc(v);
    });
    rows.push(cells.join(","));
  });
  var csvContent = rows.join("\n");
  var url = "data:text/csv;charset=utf-8,﻿" + encodeURIComponent(csvContent);
  var a = document.createElement("a");
  var title = $("title").textContent.replace(/[\/:*?"<>|]/g, "_");
  a.href = url; a.download = (title || "销售看板导出") + ".csv"; document.body.appendChild(a); a.click(); a.remove();
}
$("btnExport").onclick = exportCurrentTable;

  else if (act === "anomaly") { state.anomaly = true; state.anomalyChannel = t.dataset.ch || null; state.anomalyFilter = "all"; render(); }
  else if (act === "anomalyBack") { state.anomaly = false; state.anomalyChannel = null; render(); }
  else if (act === "prod") { state.product = t.dataset.code; render(); }
  else if (act === "prodhome") { state.product = null; render(); }
  else if (act === "prodFromCh") { state.product = t.dataset.code; state.mode = "product"; render(); }
  else if (act === "onlyNew") { state.mode = "product"; state.product = null; state.onlyNew = true; state.anomaly = false; render(); }
  else if (act === "inv") { showInvModal(t.dataset.ch, t.dataset.upc); }
});
// 面包屑在 #content 之外，单独委托；同时修复原有 chhome/prodhome 死链
$("crumb").addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.dataset.act;
  if (act === "anomalyBack") { state.anomaly = false; state.anomalyChannel = null; render(); }
  else if (act === "chhome") { state.channel = null; state.chSearchName = ""; state.chSearchUpc = ""; state.chMonths = []; render(); }
  else if (act === "prodhome") { state.product = null; render(); }
});

// 库存效期弹层关闭
$("invClose").onclick = function () { $("invModal").classList.remove("open"); };
$("invModal").addEventListener("click", function (e) { if (e.target === this) this.classList.remove("open"); });

render();
</script>
</body>
</html>
